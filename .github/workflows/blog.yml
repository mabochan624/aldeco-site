name: ブログ検証とビルド

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/blog.yml'
  workflow_dispatch:

# 生成物はローカルのフックが必ずビルドするので、CIは「検証」と「ズレの検出」だけをやる。
# 書き込み権限を持たせない＝CIがmainを勝手に書き換えることはない。
permissions:
  contents: read

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 品質ゲート。落ちたらここで止まり、生成物は更新されない＝公開されない。
      - name: 記事を検証する
        run: node tools/validate.mjs

      - name: ブログをビルドする
        run: node tools/build.mjs

      # 公開されているHTMLと、記事Markdownから作られるHTMLが一致しているかを確かめる。
      # ズレていたら「古い生成物のまま公開されている」ということなので、ここで止める。
      - name: 生成物が最新か確かめる
        run: |
          if git diff --quiet; then
            echo "✅ 生成物は記事と一致しています"
          else
            echo "::error::生成物が古いままpushされています。手元で node tools/build.mjs を実行し、差分をコミットし直してください。"
            git diff --stat
            exit 1
          fi
